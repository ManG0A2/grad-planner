<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>대학원 일정 관리</title>
<meta name="theme-color" content="#4f6df5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="대학원 플래너">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#f4f5f9;--panel:#ffffff;--border:#e4e7ef;--text:#1f2433;--muted:#7b8299;
  --primary:#4f6df5;--primary-soft:#eaeeff;--danger:#e5484d;--danger-soft:#fdecec;
  --ok:#2fb344;--radius:12px;--shadow:0 1px 2px rgba(20,30,60,.05);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary)}
h1{font-size:22px;margin:0;font-weight:700}
h2{font-size:15px;margin:0 0 10px;font-weight:700}
h3{font-size:16px;margin:0}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:12px}

/* layout */
#app{display:flex;min-height:100vh}
.sidebar{width:212px;flex:none;background:var(--panel);border-right:1px solid var(--border);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{font-weight:800;font-size:17px;padding:6px 10px 18px;letter-spacing:-.2px}
.sidebar nav{display:flex;flex-direction:column;gap:2px}
.sidebar nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:10px;font-size:14px;cursor:pointer;color:var(--text)}
.sidebar nav button:hover{background:#f0f2f8}
.sidebar nav button.active{background:var(--primary);color:#fff}
.sidebar nav button .ic{width:20px;text-align:center}
.sidebar .foot{margin-top:auto;padding:10px 12px;font-size:12px;color:var(--muted)}
#sync-badge{cursor:pointer;padding:6px 10px;border-radius:8px;display:inline-block}
#sync-badge:hover{background:#f0f2f8}
code{background:#eef0f6;padding:1px 5px;border-radius:4px;font-size:12px}
main{flex:1;min-width:0;padding:28px 32px 60px;max-width:1320px}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.page-head .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.card + .card, section.card{margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.grid2 .card{margin-bottom:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}

/* buttons */
.btn{border:1px solid var(--border);background:var(--panel);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600;font-size:13px;transition:.12s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:#f3f4f9}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:#3f5ce0}
.btn.danger{color:var(--danger);border-color:#f3c5c7}
.btn.danger:hover{background:var(--danger-soft)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:#eef0f6}
.icon-btn{border:0;background:transparent;cursor:pointer;padding:4px 6px;border-radius:6px;color:var(--muted);font-size:13px}
.icon-btn:hover{background:#eef0f6;color:var(--text)}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;color:var(--muted);user-select:none}
.toggle input{accent-color:var(--primary)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:24px;font-weight:800}
.stat span{color:var(--muted);font-size:12px}
.stat.warn b{color:var(--danger)}

/* event rows */
.ev-row{display:flex;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px solid var(--border)}
.ev-row:last-child{border-bottom:0}
.ev-row.done .ev-title{text-decoration:line-through;color:var(--muted)}
.ev-row .chk input{width:17px;height:17px;accent-color:var(--primary);cursor:pointer;display:block}
.ev-main{flex:1;min-width:0;cursor:pointer}
.ev-main:hover .ev-title{color:var(--primary)}
.ev-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:2px}
.tag{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11px;font-weight:600;background:var(--cbg);color:var(--c)}
.cat{display:inline-block;padding:1px 6px;border-radius:5px;font-size:11px;background:#eef0f6;color:#555c75}
.cat.routine{background:#e8f6f0;color:#1c7c54}
.daychks{display:flex;gap:6px;flex-wrap:wrap}
.daychks label{margin:0;cursor:pointer}
.daychks input{display:none}
.daychks span{display:inline-block;min-width:38px;text-align:center;padding:6px 8px;border:1px solid var(--border);border-radius:8px;font-weight:600;color:var(--muted);background:#fff}
.daychks input:checked + span{background:var(--primary);border-color:var(--primary);color:#fff}
.routine-row{display:flex;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px solid var(--border)}
.routine-row:last-child{border-bottom:0}
.routine-row .body{flex:1;min-width:0}
.routine-row .body b{display:block}
.routine-row .meta{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:2px}
.dday{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;min-width:44px;text-align:right}
.dday.today{color:var(--primary)}
.dday.over{color:var(--danger)}
.dday.soon{color:#e8590c}
.group-title{font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 4px;text-transform:uppercase;letter-spacing:.3px}
.group-title.over{color:var(--danger)}
.empty{color:var(--muted);padding:14px 6px;text-align:center}
.empty-state{text-align:center;padding:36px 20px}
.empty-state h2{font-size:18px}
.empty-state p{margin:6px 0 16px}

/* class rows (home) */
.cls-row{display:flex;align-items:center;gap:12px;padding:9px 8px;border-left:4px solid var(--c);background:var(--cbg);border-radius:8px;margin-bottom:6px;cursor:pointer}
.cls-row .time{font-variant-numeric:tabular-nums;font-size:12px;font-weight:700;color:var(--c);min-width:92px}
.cls-row b{flex:1}

/* timetable */
.tt-wrap{padding:0;overflow:auto}
.tt-head{display:grid;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--panel);z-index:2}
.tt-head div{padding:10px 4px;text-align:center;font-weight:700;font-size:13px}
.tt-head div.today{color:var(--primary)}
.tt-body{display:grid;position:relative}
.tt-times{position:relative}
.tt-time{position:absolute;right:8px;transform:translateY(-7px);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.tt-time.half{font-size:10px;color:#b4b9c9}
.tt-col{position:relative;border-left:1px solid var(--border);background-image:repeating-linear-gradient(to bottom,var(--border) 0 1px,transparent 1px var(--h)),repeating-linear-gradient(to bottom,#eef0f5 0 1px,transparent 1px calc(var(--h) / 2))}
.tt-col.today{background-color:#f7f9ff}
.tt-block{position:absolute;left:3px;right:3px;background:var(--cbg);border-left:4px solid var(--c);border-radius:7px;padding:5px 7px;font-size:12px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;gap:1px;line-height:1.3}
.tt-block:hover{filter:brightness(.97)}
.tt-block b{color:var(--c);font-size:12.5px}
.tt-block span{color:#555c75;font-size:11px}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.legend .pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;background:var(--panel);border:1px solid var(--border);cursor:pointer;font-size:13px}
.legend .pill:hover{border-color:var(--c)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block;flex:none}

/* calendar */
.cal-layout{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start}
.cal-nav{display:flex;align-items:center;gap:6px}
.cal-nav h1{min-width:130px;text-align:center}
.cal{padding:0;overflow-x:auto}
.cal-week,.cal-grid{min-width:560px}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--border)}
.cal-week div{text-align:center;padding:8px 0;font-size:12px;font-weight:700;color:var(--muted)}
.cal-week div:nth-child(6){color:#3b7ddd}.cal-week div:nth-child(7){color:var(--danger)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-cell{min-height:104px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:5px 5px 6px;cursor:pointer;position:relative;transition:background .1s}
.cal-cell:nth-child(7n){border-right:0}
.cal-cell:hover{background:#fafbff}
.cal-cell.out{background:#fafafc;color:#b9bdcc}
.cal-cell.out .chip{opacity:.55}
.cal-cell.sel{background:var(--primary-soft)}
.cal-cell .cal-day{font-size:12px;font-weight:700;margin-bottom:3px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.cal-cell.today .cal-day{background:var(--primary);color:#fff}
.cal-cell:nth-child(7n-1) .cal-day{color:#3b7ddd}.cal-cell:nth-child(7n) .cal-day{color:var(--danger)}
.cal-cell.today .cal-day{color:#fff}
.cal-cell .add{position:absolute;top:4px;right:4px;opacity:0;font-size:12px}
.cal-cell:hover .add{opacity:1}
.chip{font-size:11px;line-height:1.35;padding:2px 5px;border-radius:4px;margin-top:2px;background:var(--cbg);border-left:3px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.chip:hover{filter:brightness(.95)}
.chip i{font-style:normal;color:var(--c);font-weight:700}
.chip.cls{background:transparent;border-left-color:var(--c);opacity:.7;font-size:10.5px}
.chip.done{text-decoration:line-through;opacity:.5}
.more{font-size:11px;color:var(--muted);margin-top:2px}
.day-panel h2{display:flex;justify-content:space-between;align-items:center}
.day-panel .sub{font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 4px}

/* todo */
.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
select.inline{padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}

/* item cards */
.item-card{border-top:4px solid var(--c);cursor:pointer;transition:.12s;display:flex;flex-direction:column;gap:8px}
.item-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(20,30,60,.08)}
.item-card h3{display:flex;align-items:center;gap:8px}
.item-card .meta{color:var(--muted);font-size:12px;display:flex;flex-direction:column;gap:2px}
.item-card .foot{display:flex;gap:10px;font-size:12px;color:var(--muted);margin-top:auto;padding-top:6px;border-top:1px dashed var(--border)}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700}
.badge.진행중{background:#e6f7ea;color:#1f8b3a}.badge.보류{background:#fff4e0;color:#c46a00}.badge.완료{background:#eef0f6;color:#666d85}
.progress{height:6px;background:#eef0f6;border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--c)}

/* detail */
.detail-head{display:flex;gap:16px;align-items:flex-start;border-left:6px solid var(--c)}
.detail-head .info{flex:1;min-width:0}
.detail-head .info .meta{color:var(--muted);font-size:13px;margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 14px}
.tabs{display:flex;gap:4px;margin:16px 0 12px;border-bottom:1px solid var(--border)}
.tabs button{border:0;background:none;padding:9px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.active{color:var(--primary);border-bottom-color:var(--primary)}
.tabs button .n{font-size:11px;background:#eef0f6;padding:0 6px;border-radius:99px;margin-left:4px;color:var(--muted)}
.note{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start;background:#fff}
.note.pinned{border-color:#ffd43b;background:#fffbea}
.note .body{flex:1;white-space:pre-wrap;word-break:break-word;min-width:0}
.note .tools{display:flex;gap:2px;flex:none;opacity:.5}
.note:hover .tools{opacity:1}
.note textarea{width:100%}
.note-add{display:flex;gap:8px;align-items:flex-start;margin-bottom:14px}
.note-add textarea{flex:1;min-height:60px}
.att{display:flex;align-items:center;gap:10px;padding:10px 6px;border-bottom:1px solid var(--border)}
.att:last-child{border-bottom:0}
.att .ic{font-size:18px;width:26px;text-align:center}
.att .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.att .name a{text-decoration:none;color:var(--text)}
.att .name a:hover{color:var(--primary);text-decoration:underline}
.att .sub{font-size:11px;color:var(--muted);white-space:nowrap}
textarea.memo-area{width:100%;min-height:260px;resize:vertical}

/* forms */
form label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 5px}
form label:first-child{margin-top:0}
form input[type=text],form input[type=password],form input[type=date],form input[type=time],form input[type=number],form input[type=url],form select,form textarea,textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:#fff;outline:none;transition:.12s}
form input:focus,form select:focus,form textarea:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
form textarea{min-height:80px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row2 label{margin-top:12px}
.form-actions{display:flex;justify-content:space-between;gap:8px;margin-top:20px}
.form-actions .right{display:flex;gap:8px;margin-left:auto}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches label{margin:0;cursor:pointer}
.swatches input{display:none}
.swatches span{display:block;width:26px;height:26px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1px rgba(0,0,0,.06) inset}
.swatches input:checked + span{border-color:#fff;box-shadow:0 0 0 2px var(--text)}
.slot-row{display:grid;grid-template-columns:70px 1fr 16px 1fr 32px;gap:6px;align-items:center;margin-bottom:6px}
.slot-row span{text-align:center;color:var(--muted)}
.check-line{display:flex;align-items:center;gap:8px;margin-top:12px;font-weight:600}
.check-line input{width:16px;height:16px;accent-color:var(--primary)}
.hint{font-size:12px;color:var(--muted);margin-top:6px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(20,25,40,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;animation:fade .15s}
.modal{background:var(--panel);border-radius:16px;width:100%;max-width:520px;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:pop .15s}
.modal.wide{max-width:640px}
.modal header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 0}
.modal .modal-body{padding:14px 20px 20px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

/* toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1f2433;color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:99}
#toast.show{opacity:1}

@media (max-width:900px){
  #app{flex-direction:column}
  .sidebar{width:100%;height:auto;position:static;flex-direction:row;align-items:center;padding:8px 10px;overflow-x:auto}
  .brand{padding:0 12px 0 4px;white-space:nowrap}
  .sidebar nav{flex-direction:row}
  .sidebar nav button{white-space:nowrap;padding:8px 10px}
  .sidebar .foot{margin-left:auto;padding:0 4px;white-space:nowrap}
  main{padding:18px 14px 60px}
  .grid2,.cal-layout{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .cal-cell{min-height:70px}
}
</style>
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand">🎓 대학원 플래너</div>
    <nav>
      <button data-act="nav" data-view="home"><span class="ic">🏠</span>홈</button>
      <button data-act="nav" data-view="timetable"><span class="ic">🗓️</span>시간표</button>
      <button data-act="nav" data-view="calendar"><span class="ic">📅</span>캘린더</button>
      <button data-act="nav" data-view="todo"><span class="ic">✅</span>할 일</button>
      <button data-act="nav" data-view="courses"><span class="ic">📚</span>수업</button>
      <button data-act="nav" data-view="projects"><span class="ic">🔬</span>연구 과제</button>
      <button data-act="nav" data-view="settings"><span class="ic">⚙️</span>설정</button>
    </nav>
    <div class="foot"><span id="sync-badge" data-act="nav" data-view="settings" title="동기화 상태 (클릭하면 설정)"></span></div>
  </aside>
  <main id="main"></main>
</div>
<div id="modal-root"></div>
<div id="toast"></div>
<input type="file" id="file-input" hidden>
<input type="file" id="import-input" accept="application/json" hidden>

<script>
/* ============================================================
   상수 / 유틸
   ============================================================ */
const KEY = 'gradplanner.v1';
const DAYS = ['월','화','수','목','금','토','일'];
const CATEGORIES = ['과제','시험','발표','미팅','마감','기타'];
const PROJECT_STATUS = ['진행중','보류','완료'];
const COLORS = ['#4f6df5','#f0506e','#2fb344','#ff922b','#7950f2','#12b886','#e64980','#e0a800','#1c9be8','#6c757d'];
const GENERAL_COLOR = '#6c757d';
const HOUR_PX = 60;
const MAX_FILE_MB = 2;

const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const range = (a, b) => Array.from({length: b - a}, (_, i) => a + i);
const toDateStr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayStr = () => toDateStr(new Date());
const parseDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const weekdayIdx = s => (parseDate(s).getDay() + 6) % 7; // 0=월 … 6=일
const fmtDate = (s, withYear=false) => { const d = parseDate(s); return `${withYear ? d.getFullYear() + '년 ' : ''}${d.getMonth()+1}월 ${d.getDate()}일 (${DAYS[weekdayIdx(s)]})`; };
const daysBetween = (a, b) => Math.round((parseDate(b) - parseDate(a)) / 86400000);
const addDays = (s, n) => { const d = parseDate(s); d.setDate(d.getDate() + n); return toDateStr(d); };
const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const byDate = (a, b) => a.date.localeCompare(b.date) || (a.time || '').localeCompare(b.time || '');
const sty = c => `--c:${c};--cbg:${c}1f`;
const fmtBytes = n => n > 1048576 ? (n/1048576).toFixed(1) + ' MB' : n > 1024 ? Math.round(n/1024) + ' KB' : n + ' B';
const nowIso = () => new Date().toISOString();

function ddayInfo(dateStr, done) {
  if (done) return {text: '완료', cls: ''};
  const n = daysBetween(todayStr(), dateStr);
  if (n === 0) return {text: 'D-Day', cls: 'today'};
  if (n > 0) return {text: `D-${n}`, cls: n <= 3 ? 'soon' : ''};
  return {text: `D+${-n}`, cls: 'over'};
}

let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

/* ============================================================
   상태 / 저장
   ============================================================ */
function defaultState() {
  return {
    courses: [], projects: [], events: [], routines: [],
    settings: {dayCount: 5, startHour: 9, endHour: 21, showDone: false},
  };
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const p = JSON.parse(raw);
      const s = defaultState();
      return {...s, ...p, settings: {...s.settings, ...(p.settings || {})}};
    }
  } catch (e) { console.error('load failed', e); }
  return defaultState();
}
function save() {
  state.updatedAt = nowIso();
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch (e) { alert('저장 공간이 부족합니다. 첨부 파일을 줄이거나 데이터를 내보내 주세요.'); console.error(e); }
  schedulePush();
}
function commit() { save(); render(); }

let state = load();
const ui = {
  view: 'home',
  calY: new Date().getFullYear(), calM: new Date().getMonth(), selDate: todayStr(),
  detail: null,          // {type:'course'|'project', id, tab}
  todoFilter: 'all',
  showDoneProjects: false,
  editingNote: null,
};

/* ------- 조회 헬퍼 ------- */
const findCourse  = id => state.courses.find(c => c.id === id);
const findProject = id => state.projects.find(p => p.id === id);
const findEvent   = id => state.events.find(e => e.id === id);
const findItem    = (type, id) => type === 'course' ? findCourse(id) : findProject(id);
function ownerOf(e) {
  if (e.ownerType === 'course') return findCourse(e.ownerId);
  if (e.ownerType === 'project') return findProject(e.ownerId);
  return null;
}
const ownerColor = e => (ownerOf(e) || {}).color || GENERAL_COLOR;
const eventsOf = (type, id) => state.events.filter(e => e.ownerType === type && e.ownerId === id);

/* ------- 루틴(매주 반복) ------- */
const ROUTINE_PAST_DAYS = 7, ROUTINE_FUTURE_DAYS = 28;
const findRoutine = id => state.routines.find(r => r.id === id);
const isOccId = id => typeof id === 'string' && id.startsWith('r:');
const parseOccId = id => { const [, rid, date] = id.split(':'); return {rid, date}; };
function occurrence(r, d) {
  const doneAt = (r.doneDates || {})[d] || null;
  return {id: `r:${r.id}:${d}`, routineId: r.id, title: r.title, ownerType: r.ownerType, ownerId: r.ownerId,
    category: r.category, date: d, time: r.time || '', memo: r.memo || '', done: !!doneAt, doneAt, routine: r};
}
// [from, to] 범위(문자열 날짜, 양끝 포함)의 루틴 발생분을 가상 일정으로 생성
function routineOccurrences(from, to, filter) {
  const out = [];
  for (const r of state.routines) {
    if (filter && !filter(r)) continue;
    const start = r.startDate && r.startDate > from ? r.startDate : from;
    const end = r.endDate && r.endDate < to ? r.endDate : to;
    if (end < start) continue;
    for (let d = start; d <= end; d = addDays(d, 1)) {
      if (!r.days.includes(weekdayIdx(d))) continue;
      if (r.skipDates && r.skipDates[d]) continue;
      out.push(occurrence(r, d));
    }
  }
  return out;
}
// 일반 일정 + 기본 범위(지난 7일 ~ 앞으로 28일)의 루틴 발생분
function allItems(filter) {
  const t = todayStr();
  return [...state.events, ...routineOccurrences(addDays(t, -ROUTINE_PAST_DAYS), addDays(t, ROUTINE_FUTURE_DAYS), filter)];
}
const routineDaysLabel = r => '매주 ' + [...r.days].sort().map(d => DAYS[d]).join('·');
function classesOn(wd) {
  return state.courses.flatMap(c => c.slots.filter(s => s.day === wd).map(s => ({c, s})))
    .sort((a, b) => toMin(a.s.start) - toMin(b.s.start));
}

/* ============================================================
   공용 컴포넌트
   ============================================================ */
function eventRow(e, {showDate=true, showOwner=true} = {}) {
  const o = ownerOf(e);
  const dd = ddayInfo(e.date, e.done);
  return `<div class="ev-row ${e.done ? 'done' : ''}">
    <label class="chk"><input type="checkbox" data-act="toggleDone" data-id="${e.id}" ${e.done ? 'checked' : ''} title="${e.done ? '완료 취소' : '완료 처리'}"></label>
    <div class="ev-main" data-act="editEvent" data-id="${e.id}">
      <div class="ev-title">${esc(e.title)}</div>
      <div class="ev-meta">
        ${showOwner && o ? `<span class="tag" style="${sty(o.color)}">${esc(o.name)}</span>` : ''}
        <span class="cat">${esc(e.category)}</span>
        ${e.routine ? `<span class="cat routine" title="${routineDaysLabel(e.routine)}">🔁 ${routineDaysLabel(e.routine)}</span>` : ''}
        ${showDate ? `<span>${fmtDate(e.date)}</span>` : ''}
        ${e.time ? `<span>${e.time}</span>` : ''}
        ${e.memo ? `<span title="${esc(e.memo)}">📝</span>` : ''}
      </div>
    </div>
    <div class="dday ${dd.cls}">${dd.text}</div>
  </div>`;
}
const eventList = (arr, emptyMsg='일정이 없습니다.', opts) => arr.length ? arr.map(e => eventRow(e, opts)).join('') : `<div class="empty">${emptyMsg}</div>`;

function doneToggle() {
  return `<label class="toggle"><input type="checkbox" data-act="toggleShowDone" ${state.settings.showDone ? 'checked' : ''}> 완료 항목 보기</label>`;
}

/* ============================================================
   화면: 시간표
   ============================================================ */
function renderTimetable() {
  const {dayCount, startHour, endHour} = state.settings;
  const days = DAYS.slice(0, dayCount);
  const startMin = Math.round(startHour * 60), endMin = Math.round(endHour * 60);
  const total = (endMin - startMin) / 60 * HOUR_PX;
  const todayWd = weekdayIdx(todayStr());
  const hourOffset = ((60 - startMin % 60) % 60) / 60 * HOUR_PX; // 첫 정시 선 위치

  const cols = days.map((_, i) => {
    const blocks = state.courses.flatMap(c => c.slots.filter(s => s.day === i).map(s => {
      const a = Math.max(toMin(s.start), startMin), b = Math.min(toMin(s.end), endMin);
      if (b <= a) return '';
      const top = (a - startMin) / 60 * HOUR_PX, h = (b - a) / 60 * HOUR_PX;
      return `<div class="tt-block" style="top:${top}px;height:${h - 2}px;${sty(c.color)}" data-act="openDetail" data-type="course" data-id="${c.id}" title="${esc(c.name)}">
        <b>${esc(c.name)}</b><span>${s.start}–${s.end}</span>${c.room ? `<span>${esc(c.room)}</span>` : ''}</div>`;
    })).join('');
    return `<div class="tt-col ${i === todayWd ? 'today' : ''}" style="height:${total}px;background-position:0 ${hourOffset}px,0 0">${blocks}</div>`;
  }).join('');
  let times = '';
  for (let m = startMin; m <= endMin; m += 30) {
    const half = m % 60 !== 0;
    times += `<div class="tt-time ${half ? 'half' : ''}" style="top:${(m - startMin) / 60 * HOUR_PX}px">${Math.floor(m / 60)}:${pad(m % 60)}</div>`;
  }
  const hidden = state.courses.filter(c => c.slots.some(s => s.day >= dayCount));

  return `
  <div class="page-head">
    <div><h1>시간표</h1><p class="muted">수업 블록을 클릭하면 상세(일정·메모·첨부)로 이동합니다.</p></div>
    <div class="actions"><button class="btn primary" data-act="newCourse">+ 수업 추가</button></div>
  </div>
  <div class="card tt-wrap">
    <div class="tt-head" style="grid-template-columns:56px repeat(${dayCount},1fr)"><div></div>${days.map((d, i) => `<div class="${i === todayWd ? 'today' : ''}">${d}</div>`).join('')}</div>
    <div class="tt-body" style="grid-template-columns:56px repeat(${dayCount},1fr);--h:${HOUR_PX}px;padding:12px 0 16px">
      <div class="tt-times" style="height:${total}px">${times}</div>${cols}
    </div>
  </div>
  ${hidden.length ? `<p class="hint">⚠️ ${hidden.map(c => esc(c.name)).join(', ')} 수업은 주말 시간이 있어 표시되지 않습니다. 설정에서 요일 수를 늘려 주세요.</p>` : ''}
  <div class="legend">
    ${state.courses.length ? state.courses.map(c => `<span class="pill" style="${sty(c.color)}" data-act="openDetail" data-type="course" data-id="${c.id}"><span class="dot"></span>${esc(c.name)}</span>`).join('')
      : '<span class="muted">등록된 수업이 없습니다.</span>'}
  </div>`;
}

/* ============================================================
   화면: 캘린더
   ============================================================ */
function renderCalendar() {
  const {calY, calM, selDate} = ui;
  const first = new Date(calY, calM, 1);
  const offset = (first.getDay() + 6) % 7;
  const gridStart = new Date(calY, calM, 1 - offset);
  const t = todayStr();
  const {showDone} = state.settings;
  const MAX = 4;
  const gridEnd = new Date(gridStart); gridEnd.setDate(gridStart.getDate() + 41);
  const monthItems = [...state.events, ...routineOccurrences(toDateStr(gridStart), toDateStr(gridEnd))];

  let cells = '';
  for (let i = 0; i < 42; i++) {
    const d = new Date(gridStart); d.setDate(gridStart.getDate() + i);
    const ds = toDateStr(d), inMonth = d.getMonth() === calM;
    const evs = monthItems.filter(e => e.date === ds && (showDone || !e.done)).sort(byDate);
    const items = evs.map(e => `<div class="chip ${e.done ? 'done' : ''}" style="${sty(ownerColor(e))}" data-act="editEvent" data-id="${e.id}" title="${esc(e.title)}">${e.time ? `<i>${e.time}</i> ` : ''}${e.routine ? '🔁 ' : ''}${esc(e.title)}</div>`);
    const more = items.length - MAX;
    cells += `<div class="cal-cell ${inMonth ? '' : 'out'} ${ds === t ? 'today' : ''} ${ds === selDate ? 'sel' : ''}" data-act="selectDate" data-date="${ds}">
      <div class="cal-day">${d.getDate()}</div>
      <button class="icon-btn add" data-act="newEventOn" data-date="${ds}" title="일정 추가">＋</button>
      ${items.slice(0, MAX).join('')}${more > 0 ? `<div class="more">+${more}개 더</div>` : ''}
    </div>`;
  }

  // 선택 날짜 패널
  const selEvs = [...state.events, ...routineOccurrences(selDate, selDate)].filter(e => e.date === selDate && (showDone || !e.done)).sort(byDate);
  const panel = `<div class="card day-panel">
    <h2>${fmtDate(selDate)} ${selDate === t ? '<span class="tag" style="' + sty('#4f6df5') + '">오늘</span>' : ''}
      <button class="btn sm primary" data-act="newEventOn" data-date="${selDate}">+ 추가</button></h2>
    <div class="sub">일정</div>
    ${eventList(selEvs, '이 날 일정이 없습니다.', {showDate: false})}
  </div>`;

  return `
  <div class="page-head">
    <div class="cal-nav">
      <button class="btn sm" data-act="calPrev">◀</button>
      <h1>${calY}년 ${calM + 1}월</h1>
      <button class="btn sm" data-act="calNext">▶</button>
      <button class="btn sm ghost" data-act="calToday">오늘</button>
    </div>
    <div class="actions">
      ${doneToggle()}
      <button class="btn primary" data-act="newEventOn" data-date="${selDate}">+ 일정 추가</button>
    </div>
  </div>
  <div class="cal-layout">
    <div class="card cal">
      <div class="cal-week">${DAYS.map(d => `<div>${d}</div>`).join('')}</div>
      <div class="cal-grid">${cells}</div>
    </div>
    ${panel}
  </div>`;
}

/* ============================================================
   화면: 할 일
   ============================================================ */
function routineRows(list) {
  if (!list.length) return '<div class="empty">등록된 루틴이 없습니다.</div>';
  return list.map(r => {
    const o = ownerOf(r);
    return `<div class="routine-row">
      <div class="body" data-act="editRoutine" data-id="${r.id}" style="cursor:pointer"><b>${esc(r.title)}</b>
        <div class="meta">
          ${o ? `<span class="tag" style="${sty(o.color)}">${esc(o.name)}</span>` : ''}
          <span class="cat">${esc(r.category)}</span>
          <span class="cat routine">🔁 ${routineDaysLabel(r)}${r.time ? ' ' + r.time : ''}</span>
          <span>${fmtDate(r.startDate)}부터${r.endDate ? ' ' + fmtDate(r.endDate) + '까지' : ''}</span>
        </div></div>
      <button class="icon-btn" data-act="editRoutine" data-id="${r.id}" title="수정">✏️</button>
      <button class="icon-btn" data-act="deleteRoutine" data-id="${r.id}" title="삭제">🗑️</button>
    </div>`;
  }).join('');
}
function matchFilter(e, f) {
  if (f === 'all') return true;
  if (f === 'course' || f === 'project' || f === 'none') return e.ownerType === f;
  const [type, id] = f.split(':');
  return e.ownerType === type && e.ownerId === id;
}
function renderTodo() {
  const t = todayStr(), f = ui.todoFilter;
  const evs = allItems().filter(e => matchFilter(e, f));
  const routines = state.routines.filter(r => matchFilter(r, f));
  const open = evs.filter(e => !e.done).sort(byDate);
  const done = evs.filter(e => e.done).sort((a, b) => (b.doneAt || '').localeCompare(a.doneAt || ''));
  const groups = [
    {title: '기한 지남', cls: 'over', items: open.filter(e => e.date < t)},
    {title: '오늘', items: open.filter(e => e.date === t)},
    {title: '이번 주 (7일 이내)', items: open.filter(e => e.date > t && daysBetween(t, e.date) <= 7)},
    {title: '이후', items: open.filter(e => daysBetween(t, e.date) > 7)},
  ].filter(g => g.items.length);

  const opts = [
    `<option value="all">전체</option>`,
    `<option value="course" ${f === 'course' ? 'selected' : ''}>수업 전체</option>`,
    ...state.courses.map(c => `<option value="course:${c.id}" ${f === 'course:' + c.id ? 'selected' : ''}>　${esc(c.name)}</option>`),
    `<option value="project" ${f === 'project' ? 'selected' : ''}>연구 과제 전체</option>`,
    ...state.projects.map(p => `<option value="project:${p.id}" ${f === 'project:' + p.id ? 'selected' : ''}>　${esc(p.name)}</option>`),
    `<option value="none" ${f === 'none' ? 'selected' : ''}>일반</option>`,
  ].join('');

  return `
  <div class="page-head">
    <div><h1>할 일</h1><p class="muted">체크하면 목록에서 사라집니다. 남은 일정 ${open.length}개 · 완료 ${done.length}개</p></div>
    <div class="actions filters">
      <select class="inline" data-change="todoFilter">${opts}</select>
      ${doneToggle()}
      <button class="btn" data-act="newRoutine">🔁 루틴 추가</button>
      <button class="btn primary" data-act="newEvent">+ 일정 추가</button>
    </div>
  </div>
  <div class="card">
    ${groups.length ? groups.map(g => `<div class="group-title ${g.cls || ''}">${g.title} · ${g.items.length}</div>${g.items.map(e => eventRow(e)).join('')}`).join('')
      : '<div class="empty">🎉 남은 일정이 없습니다.</div>'}
    ${state.settings.showDone ? `<div class="group-title">완료됨 · ${done.length}</div>${eventList(done, '완료된 일정이 없습니다.')}` : ''}
  </div>
  <section class="card">
    <h2>🔁 반복 루틴 · ${routines.length}</h2>
    <p class="muted small" style="margin-bottom:6px">매주 반복되는 일정입니다. 위 목록에는 지난 ${ROUTINE_PAST_DAYS}일 ~ 앞으로 ${ROUTINE_FUTURE_DAYS}일 치가 자동으로 나타나고, 완료는 날짜별로 따로 체크됩니다.</p>
    ${routineRows(routines)}
  </section>`;
}

/* ============================================================
   화면: 수업 목록 / 연구 과제 목록
   ============================================================ */
function itemCounts(type, id) {
  const evs = eventsOf(type, id);
  return {open: evs.filter(e => !e.done).length, total: evs.length, done: evs.filter(e => e.done).length};
}

  <div class="page-head">
    <div><h1>수업</h1><p class="muted">수업별 일정 · 기억할 내용 · 첨부 자료를 관리합니다.</p></div>
    <div class="actions"><button class="btn primary" data-act="newCourse">+ 수업 추가</button></div>
  </div>
  <div class="cards">
    ${state.courses.length ? state.courses.map(c => {

        <div class="meta">
          ${c.professor ? `<span>👤 ${esc(c.professor)}</span>` : ''}

function renderProjects() {
  const list = state.projects.filter(p => ui.showDoneProjects || p.status !== '완료');
  const doneCount = state.projects.filter(p => p.status === '완료').length;
  return `
  <div class="page-head">
    <div><h1>연구 과제</h1><p class="muted">과제별 일정 · 기억할 내용 · 첨부 자료를 관리합니다.</p></div>
    <div class="actions">
      <label class="toggle"><input type="checkbox" data-act="toggleDoneProjects" ${ui.showDoneProjects ? 'checked' : ''}> 완료 과제 보기 (${doneCount})</label>
      <button class="btn primary" data-act="newProject">+ 과제 추가</button>
    </div>
  </div>
  <div class="cards">
    ${list.length ? list.map(p => {
      const n = itemCounts('project', p.id);
      const pct = n.total ? Math.round(n.done / n.total * 100) : 0;
      const dd = p.deadline ? ddayInfo(p.deadline, p.status === '완료') : null;
      return `<div class="card item-card" style="${sty(p.color)}" data-act="openDetail" data-type="project" data-id="${p.id}">
        <h3>${esc(p.name)} <span class="badge ${p.status}">${p.status}</span></h3>
        <div class="meta">
          ${p.lead ? `<span>👤 ${esc(p.lead)}</span>` : ''}
          ${p.deadline ? `<span>⏰ 마감 ${fmtDate(p.deadline)} <b class="dday ${dd.cls}" style="min-width:0">${dd.text}</b></span>` : ''}
        </div>
        <div class="progress" title="일정 완료율 ${pct}%"><i style="width:${pct}%"></i></div>
        <div class="foot"><span>일정 <b>${n.done}/${n.total}</b></span><span>기억할 내용 <b>${(p.notes || []).length}</b></span><span>첨부 <b>${(p.attachments || []).length}</b></span></div>
      </div>`;
    }).join('') : '<div class="card empty">표시할 연구 과제가 없습니다.</div>'}
  </div>`;
}

/* ============================================================
   화면: 상세 (수업 / 과제 공통)
   ============================================================ */
function renderDetail() {
  const {type, id, tab} = ui.detail;
  const item = findItem(type, id);
  if (!item) { ui.detail = null; return type === 'course' ? renderCourses() : renderProjects(); }
  item.notes ||= []; item.attachments ||= [];
  const evs = allItems(r => r.ownerType === type && r.ownerId === id).filter(e => e.ownerType === type && e.ownerId === id).sort(byDate);
  const open = evs.filter(e => !e.done), done = evs.filter(e => e.done);
  const routines = state.routines.filter(r => r.ownerType === type && r.ownerId === id);

  const meta = type === 'course'
    ? [item.professor && `👤 ${esc(item.professor)}`, item.room && `📍 ${esc(item.room)}`,
       `🕒 ${item.slots.length ? item.slots.map(s => `${DAYS[s.day]} ${s.start}–${s.end}`).join(', ') : '시간 미정'}`]
    : [`<span class="badge ${item.status}">${item.status}</span>`, item.lead && `👤 ${esc(item.lead)}`,
       item.deadline && `⏰ 마감 ${fmtDate(item.deadline, true)} <b class="dday ${ddayInfo(item.deadline, item.status === '완료').cls}" style="min-width:0">${ddayInfo(item.deadline, item.status === '완료').text}</b>`];

  const tabs = [
    ['events', '일정', open.length], ['notes', '기억할 내용', item.notes.length],
    ['files', '첨부', item.attachments.length], ['memo', '메모', null],
  ];
  let body = '';
  if (tab === 'events') {
    body = `<div class="page-head" style="margin-bottom:6px"><div class="filters">${doneToggle()}</div>
      <div class="actions"><button class="btn sm" data-act="newRoutineFor" data-type="${type}" data-id="${id}">🔁 루틴 추가</button>
      <button class="btn sm primary" data-act="newEventFor" data-type="${type}" data-id="${id}">+ 일정 추가</button></div></div>
      ${eventList(open, '남은 일정이 없습니다.', {showOwner: false})}
      ${state.settings.showDone ? `<div class="group-title">완료됨 · ${done.length}</div>${eventList(done, '완료된 일정이 없습니다.', {showOwner: false})}` : ''}
      ${routines.length ? `<div class="group-title">🔁 반복 루틴 · ${routines.length}</div>${routineRows(routines)}` : ''}`;
  } else if (tab === 'notes') {
    const notes = [...item.notes].sort((a, b) => (b.pinned - a.pinned) || (b.createdAt || '').localeCompare(a.createdAt || ''));
    body = `<div class="note-add"><textarea id="new-note" placeholder="기억해야 할 내용을 적고 추가 (Ctrl+Enter)"></textarea><button class="btn primary" data-act="addNote">추가</button></div>
      ${notes.length ? notes.map(n => ui.editingNote === n.id
        ? `<div class="note"><textarea id="note-edit-${n.id}">${esc(n.text)}</textarea><div class="tools" style="flex-direction:column"><button class="btn sm primary" data-act="saveNote" data-id="${n.id}">저장</button><button class="btn sm" data-act="cancelNote">취소</button></div></div>`
        : `<div class="note ${n.pinned ? 'pinned' : ''}"><div class="body">${esc(n.text)}</div>
            <div class="tools">
              <button class="icon-btn" data-act="pinNote" data-id="${n.id}" title="${n.pinned ? '고정 해제' : '상단 고정'}">${n.pinned ? '📌' : '📍'}</button>
              <button class="icon-btn" data-act="editNote" data-id="${n.id}" title="수정">✏️</button>
              <button class="icon-btn" data-act="deleteNote" data-id="${n.id}" title="삭제">🗑️</button>
            </div></div>`).join('')
        : '<div class="empty">아직 기록한 내용이 없습니다.</div>'}`;
  } else if (tab === 'files') {
    body = `<div class="page-head" style="margin-bottom:6px"><p class="muted small">링크(URL, 논문, 드라이브 경로)나 작은 파일(${MAX_FILE_MB}MB 이하)을 첨부할 수 있습니다.</p>
      <div class="actions"><button class="btn sm" data-act="addLink">🔗 링크 추가</button><button class="btn sm" data-act="attachFile">📎 파일 첨부</button></div></div>
      ${item.attachments.length ? item.attachments.map(a => `<div class="att">
          <span class="ic">${a.kind === 'link' ? '🔗' : '📄'}</span>
          <span class="name">${a.kind === 'link' ? `<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.name)}</a>` : `<a href="#" data-act="downloadAtt" data-id="${a.id}">${esc(a.name)}</a>`}</span>
          <span class="sub">${a.kind === 'link' ? esc((a.url || '').replace(/^https?:\/\//, '').slice(0, 40)) : fmtBytes(a.size || 0)}</span>
          <button class="icon-btn" data-act="deleteAtt" data-id="${a.id}" title="삭제">🗑️</button>
        </div>`).join('') : '<div class="empty">첨부된 항목이 없습니다.</div>'}`;
  } else {
    body = `<textarea class="memo-area" data-memo="1" placeholder="자유롭게 메모하세요. 자동 저장됩니다.">${esc(item.memo || '')}</textarea><p class="hint">입력하면 자동으로 저장됩니다.</p>`;
  }

  return `
  <button class="btn ghost sm" data-act="backToList" data-type="${type}">← ${type === 'course' ? '수업 목록' : '연구 과제 목록'}</button>
  <div class="card detail-head" style="${sty(item.color)};margin-top:10px">
    <div class="info">
      <h1>${esc(item.name)}</h1>
      <div class="meta">${meta.filter(Boolean).map(m => `<span>${m}</span>`).join('')}</div>
    </div>
    <div class="actions" style="display:flex;gap:6px">
      <button class="btn sm" data-act="${type === 'course' ? 'editCourse' : 'editProject'}" data-id="${id}">수정</button>
      <button class="btn sm danger" data-act="${type === 'course' ? 'deleteCourse' : 'deleteProject'}" data-id="${id}">삭제</button>
    </div>
  </div>
  <div class="tabs">${tabs.map(([k, label, n]) => `<button class="${tab === k ? 'active' : ''}" data-act="detailTab" data-tab="${k}">${label}${n != null ? `<span class="n">${n}</span>` : ''}</button>`).join('')}</div>
  <div class="card">${body}</div>`;
}

/* ============================================================
   화면: 설정
   ============================================================ */
function timeOptions(fromH, toH, sel) {
  let out = '';
  for (let m = fromH * 60; m <= toH * 60; m += 30) {
    const v = m / 60;
    out += `<option value="${v}" ${Math.abs(v - sel) < 0.01 ? 'selected' : ''}>${pad(Math.floor(m / 60))}:${pad(m % 60)}</option>`;
  }
  return out;
}
function renderSettings() {
  const s = state.settings;
  const used = new Blob([localStorage.getItem(KEY) || '']).size;
  return `
  <div class="page-head"><h1>설정</h1></div>
  <section class="card"><h2>시간표 표시</h2>
    <form data-form="settings">
      <div class="row2">
        <label>표시 요일<select name="dayCount">${[5, 6, 7].map(n => `<option value="${n}" ${s.dayCount === n ? 'selected' : ''}>${n === 5 ? '월~금' : n === 6 ? '월~토' : '월~일'}</option>`).join('')}</select></label>
        <label>&nbsp;</label>
        <label>시작 시각<select name="startHour">${timeOptions(6, 14, s.startHour)}</select></label>
        <label>종료 시각<select name="endHour">${timeOptions(12, 24, s.endHour)}</select></label>
      </div>
      <p class="hint">시간표 격자는 30분 단위로 표시되며, 수업 시간은 5분 단위로 자유롭게 넣을 수 있습니다.</p>
      <div class="form-actions"><div class="right"><button type="submit" class="btn primary">저장</button></div></div>
    </form>
  </section>
  ${renderSyncSection()}
  <section class="card"><h2>데이터 백업</h2>
    <p class="muted small" style="margin-bottom:10px">현재 사용량 ${fmtBytes(used)} · 수업 ${state.courses.length} · 과제 ${state.projects.length} · 일정 ${state.events.length} · 루틴 ${state.routines.length}</p>
    <div class="actions" style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" data-act="exportData">⬇️ JSON으로 내보내기</button>
      <button class="btn" data-act="importData">⬆️ JSON 가져오기 (덮어쓰기)</button>
      <button class="btn" data-act="loadSample">예시 데이터 불러오기</button>
      <button class="btn danger" data-act="resetData">전체 삭제</button>
    </div>
    <p class="hint">브라우저 데이터를 지우면 함께 사라지니 주기적으로 내보내기를 권장합니다.</p>
  </section>`;
}

const VIEWS = {home: renderHome, timetable: renderTimetable, calendar: renderCalendar, todo: renderTodo, courses: renderCourses, projects: renderProjects, settings: renderSettings};
function render() {
  $$('.sidebar nav button').forEach(b => b.classList.toggle('active', b.dataset.view === ui.view));
  $('#main').innerHTML = ui.detail ? renderDetail() : VIEWS[ui.view]();
}

/* ============================================================
   모달 / 폼
   ============================================================ */
function openModal({title, body, wide=false, onMount}) {
  const root = $('#modal-root');
  root.innerHTML = `<div class="overlay" data-act="closeModalBg"><div class="modal ${wide ? 'wide' : ''}">
    <header><h3>${title}</h3><button class="icon-btn" data-act="closeModal" style="font-size:16px">✕</button></header>
    <div class="modal-body">${body}</div></div></div>`;
  const firstInput = root.querySelector('input[type=text],input:not([type=hidden]),select,textarea');
  firstInput && firstInput.focus();
  onMount && onMount(root);
}
function closeModal() { $('#modal-root').innerHTML = ''; }

function colorPicker(sel) {
  return `<div class="swatches">${COLORS.map(c => `<label><input type="radio" name="color" value="${c}" ${c === sel ? 'checked' : ''}><span style="background:${c}"></span></label>`).join('')}</div>`;
}
function slotRow(s = {day: 0, start: '10:00', end: '12:00'}) {
  return `<div class="slot-row">
    <select name="day">${DAYS.map((d, i) => `<option value="${i}" ${i === s.day ? 'selected' : ''}>${d}</option>`).join('')}</select>
    <input type="time" name="start" value="${s.start}" step="300" required><span>~</span><input type="time" name="end" value="${s.end}" step="300" required>
    <button type="button" class="icon-btn" data-act="removeRow" title="삭제">✕</button></div>`;
}

function courseForm(c = {}) {
  const slots = c.slots && c.slots.length ? c.slots : [undefined];
  openModal({title: c.id ? '수업 수정' : '수업 추가', wide: true, body: `
    <form data-form="course" data-id="${c.id || ''}">
      <label>수업명 *</label><input type="text" name="name" required value="${esc(c.name || '')}" placeholder="예: 고급 기계학습">
      <div class="row2">
        <label>교수<input type="text" name="professor" value="${esc(c.professor || '')}"></label>
        <label>강의실<input type="text" name="room" value="${esc(c.room || '')}"></label>
      </div>
      <label>색상</label>${colorPicker(c.color || COLORS[state.courses.length % COLORS.length])}
      <label>수업 시간</label>
      <div id="slots">${slots.map(s => slotRow(s)).join('')}</div>

      <p class="hint">시간은 5분 단위로 자유롭게 입력할 수 있습니다. (예: 09:00–10:15, 13:30–14:45)</p>
      <label>메모</label><textarea name="memo" placeholder="평가 방식, 교재, 참고 사항 등">${esc(c.memo || '')}</textarea>
      <div class="form-actions"><div class="right"><button type="button" class="btn" data-act="closeModal">취소</button><button type="submit" class="btn primary">저장</button></div></div>
    </form>`});
}
function projectForm(p = {}) {

function eventForm(e = {}, preset = {}) {

      ${e.id ? `<label class="check-line"><input type="checkbox" name="done" ${e.done ? 'checked' : ''}> 완료됨</label>`
             : `<p class="hint">매주 반복되는 일정인가요? <a href="#" data-act="switchToRoutine">🔁 루틴으로 추가하기</a></p>`}

function ownerOptions(ownerVal) {
  return `<option value="none" ${ownerVal === 'none' ? 'selected' : ''}>일반 (소속 없음)</option>

    ${state.projects.length ? `<optgroup label="연구 과제">${state.projects.map(p => `<option value="project:${p.id}" ${ownerVal === 'project:' + p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</optgroup>` : ''}`;
}
// preset: {owner, date, title, category, time, memo, occDate}

/* ------- 폼 제출 처리 ------- */
const forms = {
  course(form) {
    const fd = new FormData(form);
    const slots = $$('.slot-row', form).map(r => ({day: +$('[name=day]', r).value, start: $('[name=start]', r).value, end: $('[name=end]', r).value}))
      .filter(s => s.start && s.end);
    if (slots.some(s => toMin(s.end) <= toMin(s.start))) return alert('종료 시간이 시작 시간보다 늦어야 합니다.');
    const data = {name: fd.get('name').trim(), professor: fd.get('professor').trim(), room: fd.get('room').trim(), color: fd.get('color'), memo: fd.get('memo'), slots};
    const id = form.dataset.id;
    if (id) Object.assign(findCourse(id), data);
    else state.courses.push({id: uid(), notes: [], attachments: [], createdAt: nowIso(), ...data});
    closeModal(); commit(); toast(id ? '수업을 수정했습니다.' : '수업을 추가했습니다.');
  },
  project(form) {
    const fd = new FormData(form);
    const data = {name: fd.get('name').trim(), lead: fd.get('lead').trim(), status: fd.get('status'), deadline: fd.get('deadline'), color: fd.get('color'), memo: fd.get('memo')};
    const id = form.dataset.id;
    if (id) Object.assign(findProject(id), data);
    else state.projects.push({id: uid(), notes: [], attachments: [], createdAt: nowIso(), ...data});
    closeModal(); commit(); toast(id ? '과제를 수정했습니다.' : '과제를 추가했습니다.');
  },
  event(form) {
    const fd = new FormData(form);
    const owner = fd.get('owner');
    const [ownerType, ownerId] = owner === 'none' ? ['none', null] : owner.split(':');
    const data = {title: fd.get('title').trim(), ownerType, ownerId, category: fd.get('category'), date: fd.get('date'), time: fd.get('time') || '', memo: fd.get('memo')};
    const id = form.dataset.id;
    if (id) {
      const e = findEvent(id);
      const wasDone = e.done, nowDone = !!fd.get('done');
      Object.assign(e, data, {done: nowDone, doneAt: nowDone ? (wasDone ? e.doneAt : nowIso()) : null});
    } else {
      state.events.push({id: uid(), done: false, doneAt: null, createdAt: nowIso(), ...data});
    }
    closeModal(); commit(); toast(id ? '일정을 수정했습니다.' : '일정을 추가했습니다.');
  },
  routine(form) {
    const fd = new FormData(form);
    const days = fd.getAll('days').map(Number);
    if (!days.length) return alert('반복 요일을 하나 이상 선택해 주세요.');
    const owner = fd.get('owner');
    const [ownerType, ownerId] = owner === 'none' ? ['none', null] : owner.split(':');
    const startDate = fd.get('startDate'), endDate = fd.get('endDate') || '';
    if (endDate && endDate < startDate) return alert('종료일이 시작일보다 빠를 수 없습니다.');
    const data = {title: fd.get('title').trim(), ownerType, ownerId, category: fd.get('category'), days, time: fd.get('time') || '', startDate, endDate, memo: fd.get('memo')};
    const id = form.dataset.id;
    if (id) Object.assign(findRoutine(id), data);
    else state.routines.push({id: uid(), doneDates: {}, skipDates: {}, createdAt: nowIso(), ...data});
    closeModal(); commit(); toast(id ? '루틴을 수정했습니다.' : '🔁 루틴을 추가했습니다.');
  },
  link(form) {
    const fd = new FormData(form);
    const item = findItem(ui.detail.type, ui.detail.id);
    item.attachments.push({id: uid(), kind: 'link', name: fd.get('name').trim(), url: fd.get('url').trim(), createdAt: nowIso()});
    closeModal(); commit();
  },
  settings(form) {
    const fd = new FormData(form);
    const startHour = +fd.get('startHour'), endHour = +fd.get('endHour');
    if (endHour <= startHour) return alert('종료 시각이 시작 시각보다 늦어야 합니다.');
    Object.assign(state.settings, {dayCount: +fd.get('dayCount'), startHour, endHour});
    commit(); toast('설정을 저장했습니다.');
  },
};

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const fn = actions[el.dataset.act];
  if (fn) fn(el, ev);
});
document.addEventListener('submit', ev => {
  const form = ev.target.closest('form[data-form]');
  if (!form) return;
  ev.preventDefault();
  forms[form.dataset.form](form);
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.change === 'todoFilter') { ui.todoFilter = t.value; render(); }
  if (t.id === 'file-input' && t.files[0]) {
    const f = t.files[0];
    if (f.size > MAX_FILE_MB * 1048576) return alert(`파일이 너무 큽니다 (${fmtBytes(f.size)}). ${MAX_FILE_MB}MB 이하만 첨부할 수 있습니다.\n큰 파일은 드라이브에 올리고 링크로 추가해 주세요.`);
    const r = new FileReader();
    r.onload = () => {
      findItem(ui.detail.type, ui.detail.id).attachments.push({id: uid(), kind: 'file', name: f.name, size: f.size, type: f.type, data: r.result, createdAt: nowIso()});
      commit(); toast('파일을 첨부했습니다.');
    };
    r.readAsDataURL(f);
  }
  if (t.id === 'import-input' && t.files[0]) {
    const r = new FileReader();
    r.onload = () => {
      try {
        const p = JSON.parse(r.result);
        if (!Array.isArray(p.courses) || !Array.isArray(p.events)) throw new Error('형식 오류');
        if (!confirm(`수업 ${p.courses.length}개 · 과제 ${(p.projects || []).length}개 · 일정 ${p.events.length}개를 가져옵니다.\n현재 데이터는 덮어써집니다. 계속할까요?`)) return;
        const s = defaultState();
        state = {...s, ...p, projects: p.projects || [], routines: p.routines || [], settings: {...s.settings, ...(p.settings || {})}};
        ui.detail = null; commit(); toast('가져오기 완료');
      } catch (e) { alert('올바른 백업 파일이 아닙니다.'); }
    };
    r.readAsText(t.files[0]);
  }
});
let memoTimer;
document.addEventListener('input', ev => {
  if (ev.target.dataset.memo && ui.detail) {
    const item = findItem(ui.detail.type, ui.detail.id);
    item.memo = ev.target.value;
    clearTimeout(memoTimer); memoTimer = setTimeout(save, 300);
  }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') closeModal();
  if (ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey)) {
    if (ev.target.id === 'new-note') actions.addNote();
    else if (ev.target.id && ev.target.id.startsWith('note-edit-')) actions.saveNote({dataset: {id: ev.target.id.replace('note-edit-', '')}});
    else if (ev.target.closest('form[data-form]')) ev.target.closest('form').requestSubmit();
  }
});

/* ============================================================
   기기 간 동기화 (GitHub Gist)
   - 비공개 Gist의 data.json 파일 하나에 전체 상태를 저장
   - 저장 시 1.5초 후 자동 업로드, 앱을 열거나 화면 복귀 시 다운로드
   - updatedAt이 더 최근인 쪽이 이김 (단, 아직 올리지 못한 로컬 변경이 있으면 로컬 우선)
   ============================================================ */
const SYNC_KEY = 'gradplanner.sync';
const syncState = {cfg: loadSyncCfg(), status: 'off', msg: '', timer: null, pushing: false};
function loadSyncCfg() { try { return JSON.parse(localStorage.getItem(SYNC_KEY)) || null; } catch (e) { return null; } }
function saveSyncCfg(cfg) {
  syncState.cfg = cfg;
  if (cfg) localStorage.setItem(SYNC_KEY, JSON.stringify(cfg)); else localStorage.removeItem(SYNC_KEY);
}
function markDirty(flag) { if (syncState.cfg && syncState.cfg.dirty !== flag) { syncState.cfg.dirty = flag; saveSyncCfg(syncState.cfg); } }
const SYNC_LABELS = {off: ['⚪', '동기화 안 함'], ok: ['🟢', '동기화됨'], saving: ['🟡', '올리는 중…'], pulling: ['🟡', '가져오는 중…'], error: ['🔴', '동기화 실패'], offline: ['⚪', '오프라인 · 저장 대기']};
function setSyncStatus(status, msg = '') {
  syncState.status = status; syncState.msg = msg;
  renderSyncBadge();
  const line = $('#sync-status-line'); if (line) line.innerHTML = syncStatusHTML();
}
function syncStatusHTML() {
  const [ic, label] = SYNC_LABELS[syncState.status] || SYNC_LABELS.off;
  return `${ic} ${label}${syncState.msg ? ` <span class="muted">· ${esc(syncState.msg)}</span>` : ''}`;
}
function renderSyncBadge() {
  const el = $('#sync-badge'); if (!el) return;
  const [ic, label] = SYNC_LABELS[syncState.status] || SYNC_LABELS.off;
  el.textContent = `${ic} ${label}`;
}
function extractGistId(s) {
  s = (s || '').trim();
  const m = s.match(/[0-9a-f]{16,}/i);
  return m ? m[0] : s.split('/').filter(Boolean).pop() || '';
}
async function gistRequest(method, cfg, body, keepalive = false) {
  const res = await fetch(`https://api.github.com/gists/${cfg.gistId}`, {
    method, cache: 'no-store', keepalive,
    headers: {Authorization: `Bearer ${cfg.token}`, Accept: 'application/vnd.github+json', ...(body ? {'Content-Type': 'application/json'} : {})},
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) {
    const hint = res.status === 401 ? '토큰이 올바르지 않습니다' : res.status === 404 ? 'Gist를 찾을 수 없습니다 (ID·토큰 권한 확인)' : res.status === 403 ? '권한이 없거나 요청 한도를 넘었습니다' : `HTTP ${res.status}`;
    throw new Error(hint);
  }
  return res.json();
}
async function pullRemote(cfg) {
  const g = await gistRequest('GET', cfg);
  const f = g.files && g.files['data.json'];
  if (!f) return null;
  let content = f.content;
  if (f.truncated) content = await (await fetch(f.raw_url, {cache: 'no-store'})).text();
  if (!content || !content.trim()) return null;
  try { const p = JSON.parse(content); return p && Array.isArray(p.events) ? p : null; } catch (e) { return null; }
}
async function pushRemote(cfg, data, keepalive = false) {
  await gistRequest('PATCH', cfg, {files: {'data.json': {content: JSON.stringify(data)}}}, keepalive);
}
const hasData = s => !!(s && ((s.courses || []).length || (s.projects || []).length || (s.events || []).length || (s.routines || []).length));
function applyRemote(remote) {
  const s = defaultState();
  state = {...s, ...remote, projects: remote.projects || [], routines: remote.routines || [], settings: {...s.settings, ...(remote.settings || {})}};
  localStorage.setItem(KEY, JSON.stringify(state)); // save()를 거치지 않음 (updatedAt 유지, 재업로드 방지)
  ui.editingNote = null;
  render();
}
function schedulePush() {
  if (!syncState.cfg) return;
  markDirty(true);
  clearTimeout(syncState.timer);
  syncState.timer = setTimeout(() => pushNow(), 1500);
}
async function pushNow(keepalive = false) {
  const cfg = syncState.cfg;
  if (!cfg || !cfg.dirty || syncState.pushing) return;
  if (!navigator.onLine) { setSyncStatus('offline'); return; }
  syncState.pushing = true; setSyncStatus('saving');
  const sentAt = state.updatedAt;
  try {
    await pushRemote(cfg, state, keepalive);
    if (state.updatedAt === sentAt) { markDirty(false); setSyncStatus('ok'); }
    else { syncState.pushing = false; return pushNow(); } // 올리는 동안 또 바뀜 → 한 번 더
  } catch (e) {
    setSyncStatus('error', e.message);
  } finally { syncState.pushing = false; }
}
async function pullAndMerge() {
  const cfg = syncState.cfg;
  if (!cfg || !navigator.onLine || syncState.pushing) return;
  if (cfg.dirty) return pushNow(); // 아직 못 올린 로컬 변경이 우선
  setSyncStatus('pulling');
  try {
    const remote = await pullRemote(cfg);
    const r = (remote && remote.updatedAt) || '', l = state.updatedAt || '';
    if (remote && r > l) { applyRemote(remote); toast('다른 기기의 변경 사항을 가져왔습니다.'); }
    else if (hasData(state) && (!remote || r < l)) { markDirty(true); return pushNow(); }
    setSyncStatus('ok');
  } catch (e) { setSyncStatus('error', e.message); }
}
function renderSyncSection() {
  const cfg = syncState.cfg;
  if (cfg) return `<section class="card"><h2>📱 기기 간 동기화 (GitHub Gist)</h2>
    <p class="small" style="margin-bottom:6px">연결됨 · Gist <a href="https://gist.github.com/${esc(cfg.gistId)}" target="_blank" rel="noopener"><code>${esc(cfg.gistId)}</code></a> · 토큰 <code>${esc(cfg.token.slice(0, 7))}…</code></p>
    <p class="small" id="sync-status-line" style="margin-bottom:10px">${syncStatusHTML()}</p>
    <div class="actions" style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" data-act="syncNow">🔄 지금 동기화</button>
      <button class="btn danger" data-act="syncDisconnect">연결 해제</button>
    </div>
    <p class="hint">저장할 때마다 자동으로 Gist에 올리고, 앱을 열거나 화면으로 돌아올 때 다른 기기의 변경 사항을 가져옵니다. 더 최근에 저장한 쪽이 우선합니다.</p>
  </section>`;
  return `<section class="card"><h2>📱 기기 간 동기화 (GitHub Gist)</h2>
    <p class="muted small" style="margin-bottom:8px">비공개 Gist 하나를 저장소로 씁니다. 폰과 PC에서 각각 한 번씩만 입력하면 이후로는 자동입니다.</p>
    <form data-form="sync">
      <label>Gist 주소 또는 ID</label><input type="text" name="gistId" required placeholder="https://gist.github.com/아이디/abc123… 또는 abc123…" autocomplete="off">
      <label>GitHub 토큰 (classic · gist 권한)</label><input type="password" name="token" required placeholder="ghp_…" autocomplete="off">
      <div class="form-actions"><div class="right"><button type="submit" class="btn primary">연결</button></div></div>
    </form>
    <p class="hint">토큰은 이 브라우저에만 저장되며 GitHub 외의 어디로도 전송되지 않습니다. 공용 PC에서는 연결하지 마세요.</p>
  </section>`;
}
forms.sync = async form => {
  const fd = new FormData(form);
  const gistId = extractGistId(fd.get('gistId')), token = fd.get('token').trim();
  if (!gistId || !token) return alert('Gist ID와 토큰을 모두 입력해 주세요.');
  const btn = form.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = '확인 중…';
  const cfg = {gistId, token, dirty: false};
  try {
    const remote = await pullRemote(cfg);
    saveSyncCfg(cfg);
    if (hasData(remote) && (!hasData(state) || confirm('Gist에 이미 저장된 데이터가 있습니다.\n\n[확인] Gist 데이터를 이 기기로 가져오기\n[취소] 이 기기의 데이터로 Gist를 덮어쓰기'))) {
      applyRemote(remote); setSyncStatus('ok'); toast('Gist 데이터를 가져왔습니다.'); return;
    }
    markDirty(true); await pushNow();
    render(); toast('연결되었습니다. 현재 데이터를 Gist에 올렸습니다.');
  } catch (e) {
    saveSyncCfg(null); setSyncStatus('off');
    alert('연결 실패: ' + e.message); btn.disabled = false; btn.textContent = '연결';
  }
};
actions.syncNow = async () => { if (syncState.cfg.dirty) await pushNow(); else await pullAndMerge(); toast(syncState.status === 'ok' ? '동기화 완료' : '동기화 실패: ' + syncState.msg); };
actions.syncDisconnect = () => {
  if (!confirm('동기화 연결을 해제할까요?\nGist의 데이터와 이 기기의 데이터는 그대로 남습니다.')) return;
  saveSyncCfg(null); setSyncStatus('off'); render(); toast('연결을 해제했습니다.');
};
window.addEventListener('online', () => pullAndMerge());
window.addEventListener('offline', () => syncState.cfg && setSyncStatus('offline'));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') pullAndMerge(); });
window.addEventListener('pagehide', () => { if (syncState.cfg && syncState.cfg.dirty) { clearTimeout(syncState.timer); pushNow(true); } });

/* ============================================================
   시작
   ============================================================ */
render();
if (syncState.cfg) { setSyncStatus(navigator.onLine ? 'pulling' : 'offline'); pullAndMerge(); } else renderSyncBadge();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW 등록 실패', e));
}
</script>
</body>
</html>
